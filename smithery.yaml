# Smithery configuration — https://smithery.ai/docs/build/project-config/smithery.yaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - blazingcdnApiToken
    properties:
      blazingcdnApiToken:
        type: string
        description: BlazingCDN API token — in the panel open API (client.blazingcdn.com/api) and create new API credentials
      allowWrite:
        type: boolean
        default: false
        description: Allow changes — let the agent create and change CDN settings (image processing, caching, domains)
      allowDelete:
        type: boolean
        default: false
        description: Allow deleting — custom domains and Video CDN resources only; CDN resources, buckets and the account can never be deleted
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        BLAZINGCDN_API_TOKEN: config.blazingcdnApiToken,
        ...(config.allowWrite ? { BLAZINGCDN_ALLOW_WRITE: '1' } : {}),
        ...(config.allowDelete ? { BLAZINGCDN_ALLOW_DELETE: '1' } : {})
      }
    })
  exampleConfig:
    blazingcdnApiToken: your-blazingcdn-api-token
    allowWrite: false
    allowDelete: false
